name: Pages 演示站

# Pages 上跑不了 FastAPI，所以发的是「静态前端 + 预生成的估值 payload」。
# payload 由 scripts/export_demo_api.py 现场调用后端同一份 valuation 代码算出来，
# 不在前端重写一遍口径；data/valuation_history.json 每天被估值归档任务更新，
# 所以这里跟着 main 的每次推送重建，数据始终跟得上。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements.txt

      - name: 生成演示站 payload（估值面板 + 导航/品牌）
        run: python scripts/export_demo_api.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build:pages
        working-directory: frontend
        env:
          VITE_DEMO: "1"

      # 项目站点没有 SPA rewrite，深链接直接 404；给 index.html 一份副本兜住
      - run: cp dist/index.html dist/404.html
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - id: out
        uses: actions/deploy-pages@v4
