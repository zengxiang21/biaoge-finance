name: Pages 演示站

# Pages 上跑不了 FastAPI，所以发的是「静态前端 + 预抓好的接口 payload」。
# payload 由 scripts/export_demo_api.py --live 在 runner 上现抓一轮行情（收盘快照、
# 板块、快讯、全球指数…），再直接调用线上同一份 router 把返回结果写成静态 JSON，
# 口径不在前端重写一遍。一轮实测 10~11 分钟，所以盘中每半小时抓一次，数据延迟上限
# 就是 30 分钟；push 时也重建。

on:
  push:
    branches: [main]
  schedule:
    # 下面都是 UTC，减 8 才是北京时间。盘中 09:00~14:30 每半小时一轮
    - cron: "*/30 1-6 * * 1-5"
    # 15:00 收盘、15:30 盘后各补一轮
    - cron: "0,30 7 * * 1-5"
    # 19:30 晚间一轮，排在 18:40 的估值归档之后，估值快照的新数据也带得上
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements.txt

      - name: 现抓一轮行情并生成演示站 payload
        run: python scripts/export_demo_api.py --live
        # runner 默认 UTC，横幅上的「抓取于」会差 8 小时；交易口径也按北京时间算
        env:
          TZ: Asia/Shanghai

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build:pages
        working-directory: frontend
        env:
          VITE_DEMO: "1"

      # 项目站点没有 SPA rewrite，深链接直接 404；给 index.html 一份副本兜住
      - run: cp dist/index.html dist/404.html
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - id: out
        uses: actions/deploy-pages@v4
